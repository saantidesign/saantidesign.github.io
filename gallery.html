<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALLERY</title>
<meta name="description" content="Full project gallery of Ava Moreau, visual and brand designer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-grid" aria-hidden="true"></div>

<div class="enter-overlay" id="enter-overlay">
  <button class="enter-btn" id="enter-btn" type="button">Enter</button>
</div>

<div class="site-content" id="site-content">

  <header class="top-bar">
    <span class="wordmark">S. COMPLETO</span>
    <nav class="top-nav" aria-label="Primary">
      <a href="index.html#work">Work</a>
      <a href="gallery.html">Gallery</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light and dark mode">
      <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
    </button>
  </header>

  <main class="gallery-main">
    <div class="gallery-heading">
      <h1 class="gallery-title">GALLERY</h1>
      <a class="back-link" href="index.html">← Back home</a>
    </div>

    <div class="filter-row" id="filter-row">
      <button class="filter-chip is-active" data-filter="all" type="button">All</button>
      <button class="filter-chip" data-filter="branding" type="button">Branding</button>
      <button class="filter-chip" data-filter="type" type="button">Type</button>
      <button class="filter-chip" data-filter="print" type="button">Print</button>
      <button class="filter-chip" data-filter="packaging" type="button">Packaging</button>
      <button class="filter-chip" data-filter="editorial" type="button">Editorial</button>
    </div>

    <div class="work-grid gallery-grid" id="work-grid">

      <article class="project-card" data-category="branding packaging">
        <span class="card-plate plate-a" aria-hidden="true"></span>
        <h3>Placeholder</h3>
        <p>Branding · 2026</p>
      </article>

      <article class="project-card" data-category="type">
        <span class="card-plate plate-b" aria-hidden="true"></span>
        <h3>Placeholder</h3>
        <p>Type design · 2026</p>
      </article>

      <article class="project-card" data-category="editorial print">
        <span class="card-plate plate-c" aria-hidden="true"></span>
        <h3>Placeholder</h3>
        <p>Editorial · 2026</p>
      </article>

      <article class="project-card" data-category="branding">
        <span class="card-plate plate-d" aria-hidden="true"></span>
        <h3>Placeholder</h3>
        <p>Branding · 2026</p>
      </article>

      <article class="project-card" data-category="print editorial">
        <span class="card-plate plate-a" aria-hidden="true"></span>
        <h3>Placeholder</h3>
        <p>Print · 2026</p>
      </article>

      <article class="project-card" data-category="packaging type">
        <span class="card-plate plate-b" aria-hidden="true"></span>
        <h3>Placeholder</h3>
        <p>Packaging · 2026</p>
      </article>

    </div>
  </main>

  <footer class="site-footer">
    <span>© 2026 Santiago Completo</span>
    <span>Toronto, ON</span>
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
